name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # E2E testleri kaldirildi: canli (production) veritabanina karsi kosuyor ve
      # her push'ta "E2E Test" cop kayitlari biraktigi icin devre disi birakildi.
      # Geri acmak istenirse: ayri bir test veritabani + sonda cleanup sart.
